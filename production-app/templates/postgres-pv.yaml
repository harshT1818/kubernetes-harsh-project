apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv

spec:
  capacity:
    storage: {{ .Values.postgres.storage.size }}

  accessModes:
    - {{ .Values.postgres.storage.accessMode }}

  persistentVolumeReclaimPolicy: {{ .Values.postgres.storage.reclaimPolicy }}

  storageClassName: {{ .Values.postgres.storage.storageClassName }}

  hostPath:
    path: {{ .Values.postgres.storage.hostPath }}