backend:
  replicaCount: 2

  image:
    repository: production-backend
    tag: "2.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  probes:
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10

    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 20

  database:
    host: postgres-service
    port: "5432"
    name: appdb
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

frontend:
  replicaCount: 2

  image:
    repository: production-frontend
    tag: "2.2"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

  probes:
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10

    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 20

postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  service:
    port: 5432

  database: appdb

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  storage:
    size: 2Gi
    storageClassName: manual
    accessMode: ReadWriteOnce
    reclaimPolicy: Retain
    hostPath: /data/postgres

  scheduling:
    nodeLabelKey: workload
    nodeLabelValue: database
    taintKey: dedicated
    taintValue: database
    taintEffect: NoSchedule

secrets:
  postgresUser: appuser
  postgresPassword: change-me