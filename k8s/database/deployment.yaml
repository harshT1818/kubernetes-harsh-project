apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: production-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
        affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - database

        tolerations:
        - key: dedicated
            operator: Equal
            value: database
            effect: NoSchedule
            
        containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          envFrom:
            - configMapRef:
                name: postgres-config

            - secretRef:
                name: postgres-secret

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 20

            volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

        volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc


        - key: dedicated
          operator: Equal
          value: database
          effect: NoSchedule